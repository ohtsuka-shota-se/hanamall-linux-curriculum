# Apache バーチャルホスト設定例：site-b.local
<VirtualHost *:80>
    ServerName site-b.local

    DocumentRoot /var/www/site-b

    CustomLog /var/log/apache2/site-b_access.log combined
    ErrorLog  /var/log/apache2/site-b_error.log

    <Directory /var/www/site-b>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
