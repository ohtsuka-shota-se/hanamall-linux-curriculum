# Apache バーチャルホスト設定例：site-a.local
<VirtualHost *:80>
    ServerName site-a.local

    DocumentRoot /var/www/site-a

    CustomLog /var/log/apache2/site-a_access.log combined
    ErrorLog  /var/log/apache2/site-a_error.log

    <Directory /var/www/site-a>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
